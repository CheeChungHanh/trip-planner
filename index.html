        <button class="drag-handle" data-action="noop" title="Drag to reorder">⠿</button><button class="stop-num" data-action="select-stop" data-id="${s.id}">${i+1}</button>
        <div class="stop-content"><div class="stop-title-row"><strong>${esc(s.name)}</strong><button class="stop-more" data-action="toggle-edit" data-id="${s.id}" title="Edit stop">•••</button></div>
        <div class="stop-meta"><span>${catGlyph(s.category)}</span><span>${esc(s.category)}</span><i class="dot"></i><span>${timeLabel(s.time)}</span></div><div class="stop-address">${esc(s.address)}</div>${s.approximate?'<div class="approx-note">Demo pin only · live place search not connected</div>':''}
        ${editingId===s.id?`<div class="stop-actions"><label>Visit time<input type="time" data-edit="time" data-id="${s.id}" value="${esc(s.time)}"></label><label>Duration<select data-edit="duration" data-id="${s.id}"><option value="30" ${s.duration===30?'selected':''}>30 minutes</option><option value="45" ${s.duration===45?'selected':''}>45 minutes</option><option value="60" ${s.duration===60?'selected':''}>1 hour</option><option value="90" ${s.duration===90?'selected':''}>1.5 hours</option><option value="120" ${s.duration===120?'selected':''}>2 hours</option><option value="180" ${s.duration===180?'selected':''}>3 hours</option></select></label><label class="notes-input">Notes<textarea data-edit="notes" data-id="${s.id}" placeholder="Anything to remember?">${esc(s.notes||'')}</textarea></label><div class="stop-action-footer"><a href="${gSearch(s)}" target="_blank" rel="noreferrer">↗ Open in Google Maps</a><button class="delete-stop" data-action="delete-stop" data-id="${s.id}">⌫ Remove stop</button></div></div>`:''}</div>
        <div class="stop-time"><span>${duration(s.duration)}</span><span>visit</span></div>
      </div><div class="reorder-buttons"><button data-action="move-stop" data-index="${i}" data-delta="-1" ${i===0?'disabled':''} title="Move stop up">↑</button><button data-action="move-stop" data-index="${i}" data-delta="1" ${i===stops.length-1?'disabled':''} title="Move stop down">↓</button></div>
      </div>${leg?`<div class="leg-row"><div class="leg-line"><span></span></div><div class="leg-info"><span>${modeGlyph(s.transport)}</span><select aria-label="Transport from ${esc(s.name)}" data-edit="transport" data-id="${s.id}"><option value="transit" ${s.transport==='transit'?'selected':''}>Public transport</option><option value="drive" ${s.transport==='drive'?'selected':''}>Car</option><option value="walk" ${s.transport==='walk'?'selected':''}>Walk</option></select><span class="leg-dot">·</span><strong>${duration(leg.mins)}</strong><span class="leg-distance">${leg.km.toFixed(1)} km</span><a class="leg-external" href="${gDirections([s,stops[i+1]],s.transport)}" target="_blank" rel="noreferrer" title="Open route in Google Maps">↗</a></div><span class="leg-route-hint">Estimated journey</span></div>`:''}`}).join('');
    const stay=stops.reduce((n,s)=>n+s.duration,0),travel=stops.slice(0,-1).reduce((n,s,i)=>n+estimate(s,stops[i+1],s.transport).mins,0);
    app.innerHTML=`<aside class="sidebar" id="sidebar"><div class="brand-row"><div class="brand-mark">✥</div><div><div class="brand-name">wayfarer<span>.</span></div><div class="brand-tagline">TRAVEL, THOUGHTFULLY</div></div><button class="icon-btn sidebar-close" data-action="close-menu">✕</button></div><div class="sidebar-label">WORKSPACE</div><button class="nav-link active">▦ <span>My trips</span><span class="nav-count">${trips.length}</span></button><div class="section-row"><span class="sidebar-label">YOUR TRIPS</span><button class="tiny-add" data-action="new-trip">＋</button></div><div class="trip-list">${tripNav}</div><button class="new-trip-side" data-action="new-trip">＋ New trip</button><div class="sidebar-bottom"><div class="tip-card"><div class="tip-sparkle">✧</div><strong>A little tip</strong><p>Leave some breathing room between stops. The best travel moments are often unplanned.</p></div><button class="profile-row"><span class="avatar">J</span><span><strong>Travel workspace</strong><small>Personal planner</small></span><span>•••</span></button></div></aside>${mobileSidebarOpen?'<button class="mobile-scrim" data-action="close-menu" aria-label="Close menu"></button>':''}
    <main class="main"><header class="topbar"><div class="topbar-left"><button class="icon-btn menu-toggle" data-action="open-menu">☰</button><div class="breadcrumb"><span>My trips</span><span>›</span><strong>${esc(t.title)}</strong></div></div><div class="top-actions"><div class="saved-status"><span class="saved-dot"></span> All changes saved</div><button class="icon-btn top-settings" data-action="map-settings" title="Connect Google Maps">⚙</button><div class="mini-avatar">J</div></div></header>
    <div class="content"><section class="trip-heading"><div class="trip-heading-main"><div class="eyebrow"><span class="eyebrow-line"></span> YOUR NEXT ADVENTURE</div><div class="title-line"><h1>${esc(t.title)}</h1><div style="position:relative"><button class="icon-btn" data-action="trip-menu">•••</button>${tripMenu?`<div class="dropdown"><button data-action="duplicate-trip">▣ Duplicate trip</button><button class="danger" data-action="delete-trip">⌫ Delete trip</button></div>`:''}</div></div><div class="trip-summary"><span>⌖ ${esc(t.destination)}</span><i class="sep"></i><span>▦ ${dateLabel(t.start,{month:'short',day:'numeric'})} – ${dateLabel(t.end,{month:'short',day:'numeric',year:'numeric'})}</span><i class="sep"></i><span>⌖ ${total} places</span></div></div><button class="btn btn-outline share-button" data-action="share-trip">↗ <span class="share-label">Share trip</span></button></section>
    <section class="day-nav-section"><div class="day-nav-top"><div><h2>Your itinerary</h2><p>One day at a time, at your own pace.</p></div><button class="btn btn-primary add-place-top" data-action="add-place">＋ Add a place</button></div><div class="day-tabs-wrap"><button class="day-arrow" data-action="prev-day" ${dayIndex===0?'disabled':''}>‹</button><div class="day-tabs">${dayTabs}</div><button class="day-arrow" data-action="next-day" ${dayIndex===t.days.length-1?'disabled':''}>›</button></div></section>
    <section class="day-title-row"><div><div class="day-kicker">DAY ${String(dayIndex+1).padStart(2,'0')} <span>•</span> ${dateLabel(dy.date,{weekday:'long',month:'long',day:'numeric'})}</div><h2>${esc(dy.title)}</h2></div><button class="icon-btn" data-action="day-tip">•••</button></section>
    <section class="planner-grid"><div class="itinerary">${stops.length?`<div class="timeline-topline"><span class="timeline-dot"></span><span>${stops.length} STOPS PLANNED</span><span class="timeline-line"></span></div><div class="stop-list">${cards}</div><button class="add-stop-inline" data-action="add-place"><span class="add-stop-circle">＋</span><span>Add another stop</span><span class="add-stop-shortcut">+</span></button><div class="day-summary"><div class="summary-icon">◷</div><div class="summary-copy"><strong>A day well planned</strong><span>About ${duration(stay+travel)} of activities and travel time.</span></div><div class="summary-stat"><strong>${stops.length}</strong><span>stops</span></div></div>`:`<div class="empty-itinerary"><div class="empty-art">⌖</div><h3>Make this day yours</h3><p>There's room for a new discovery. Add your first place and start shaping the day.</p><button class="btn btn-primary" data-action="add-place">＋ Add your first place</button></div>`}<div class="planning-note">✧ <span><strong>Keep it flexible.</strong> These are your plans, not a checklist. Leave space for the unexpected.</span></div></div>
    <aside class="map-column"><div class="map-card"><div class="map-card-header"><div><div class="map-heading-label">⌖ DAILY ROUTE</div><h3>Explore the area</h3></div><button class="icon-btn" data-action="map-settings" title="Map settings">•••</button></div><div class="map-mode-tabs"><button data-action="map-mode" data-mode="transit" class="${mapMode==='transit'?'active':''}">🚆 Transit</button><button data-action="map-mode" data-mode="drive" class="${mapMode==='drive'?'active':''}">🚗 Drive</button><button data-action="map-mode" data-mode="walk" class="${mapMode==='walk'?'active':''}">↟ Walk</button></div><div class="map-canvas" id="map-canvas"></div><div class="map-legend"><div><span class="legend-route"></span><span>Day route</span></div><div><span class="legend-pin">${stops.length||'•'}</span><span>${stops.length} stops</span></div></div><div class="map-route-footer"><div class="map-route-footer-icon">➤</div><div class="map-route-footer-copy"><strong>${stops.length>1?`${stops.length-1} journeys between stops`:stops.length===1?'Your first stop is mapped':'Ready when you are'}</strong><span>${localStorage.getItem('wayfarer-google-key')?'Google Maps directions preview':'Route line is approximate in demo mode'}</span></div><a class="route-open-btn" href="${gDirections(stops,mapMode)}" target="_blank" rel="noreferrer" title="Open full route in Google Maps">↗</a></div></div><div class="travel-tip"><div class="travel-tip-icon">✧</div><div><div class="travel-tip-label">TRAVEL TIP</div><p>Start your day at the farthest stop and work your way back. Less time travelling, more time exploring.</p></div></div></aside></section></div><footer class="footer"><span>Made for curious travellers.</span><span>Wayfarer <span class="footer-dot">·</span> Trip planner</span></footer></main>`;
    if(!mapOpen) mobileSidebarOpen=false;
    renderMap(stops,t.destination);
  }
  let mobileSidebarOpen=false,tripMenu=false,mapOpen=true;
  function renderMap(stops,destination){
    const holder=document.getElementById('map-canvas');if(!holder)return;
    if(map){try{map.remove()}catch(e){} map=null;}
    const key=localStorage.getItem('wayfarer-google-key');
    if(key && stops.length){let url='https://www.google.com/maps/embed/v1/';const mode=mapMode==='drive'?'driving':mapMode==='walk'?'walking':'transit';const params=new URLSearchParams({key});if(stops.length===1){url+='place';params.set('q',`${stops[0].lat},${stops[0].lng}`)}else{url+='directions';params.set('origin',`${stops[0].lat},${stops[0].lng}`);params.set('destination',`${stops[stops.length-1].lat},${stops[stops.length-1].lng}`);params.set('mode',mode);if(stops.length>2)params.set('waypoints',stops.slice(1,-1).map(s=>`${s.lat},${s.lng}`).join('|'));}holder.innerHTML=`<iframe class="google-map-frame" title="Route map for ${esc(destination)}" src="${url+'?'+params.toString()}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><div class="map-provider-pill"><span class="provider-dot"></span>Google Maps</div>`;return;}
    holder.innerHTML=`<div id="leaflet-map" class="map-host"></div><div class="map-provider-pill"><span class="provider-dot"></span>OpenStreetMap preview</div>${!stops.length?'<div class="empty-map-overlay"><div class="empty-map-icon">⌖</div><strong>Your route will appear here</strong><span>Add a place to start your day.</span></div>':''}`;
    if(!window.L){const host=document.getElementById('leaflet-map');if(host)host.innerHTML='<div style="padding:50px 22px;text-align:center;color:#71806f;font-size:12px">The map needs an internet connection to load map tiles. You can still edit your itinerary.</div>';return;}
    map=L.map('leaflet-map',{zoomControl:true,scrollWheelZoom:true}).setView(stops.length?[stops[0].lat,stops[0].lng]:DEFAULT_CENTER,stops.length?12:11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors',maxZoom:19}).addTo(map);
    const pts=[];
    stops.forEach((s,i)=>{const pt=[s.lat,s.lng];pts.push(pt);const icon=L.divIcon({className:'',html:`<div class="wayfarer-pin ${s.id===selectedId?'active':''}">${i+1}</div>`,iconSize:[32,32],iconAnchor:[16,16]});const m=L.marker(pt,{icon}).addTo(map);m.bindPopup(`<div class="map-popup"><strong>${esc(s.name)}</strong><span>${esc(s.address)}</span><small>Stop ${i+1} · ${timeLabel(s.time)}</small></div>`);m.on('click',()=>{selectedId=s.id;});});
    if(pts.length>1){routeLayer=L.polyline(pts,{color:'#397962',weight:4,opacity:.86,dashArray:'8 8'}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[28,28],maxZoom:14});}else if(pts.length===1){map.setView(pts[0],14);}setTimeout(()=>map&&map.invalidateSize(),100);
  }
  function openModal(type){modal=type;searchQuery='';selectedPlaceName=null;modalRoot.innerHTML='';renderModal();}
  function closeModal(){modal=null;modalRoot.innerHTML='';}
  function renderModal(){
    if(!modal){modalRoot.innerHTML='';return;}
    if(modal==='new-trip'){modalRoot.innerHTML=`<div class="modal-backdrop" data-backdrop><form class="modal-card" id="new-trip-form"><div class="modal-top"><div class="modal-icon">✈</div><button type="button" class="icon-btn" data-action="close-modal">✕</button></div><h2>Create a new trip</h2><p class="modal-subtitle">Start with the basics. You can add places and details next.</p><label class="field-label">Trip name <span class="optional">Optional</span><input name="title" placeholder="e.g. Summer in Japan"></label><label class="field-label">Destination<input name="destination" required placeholder="e.g. Kyoto, Japan" autofocus></label><div class="date-fields"><label class="field-label">Start date<input name="start" type="date" value="2026-11-12" required></label><label class="field-label">End date<input name="end" type="date" value="2026-11-15" required></label></div><div class="form-error" hidden></div><div class="modal-actions"><button type="button" class="btn btn-quiet" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">＋ Create trip</button></div></form></div>`;return;}
    if(modal==='add-place'){const q=searchQuery.trim().toLowerCase(),suggestions=(q?library.filter(p=>`${p.name} ${p.category} ${p.address}`.toLowerCase().includes(q)):library.slice(0,5)).slice(0,7);modalRoot.innerHTML=`<div class="modal-backdrop" data-backdrop><div class="modal-card wide"><div class="modal-top"><div class="modal-icon">⌖</div><button class="icon-btn" data-action="close-modal">✕</button></div><h2>Add a place</h2><p class="modal-subtitle">Search the demo list or add a custom place by name.</p><div class="place-search">⌕ <input id="place-query" placeholder="Search attractions, food, cafes…" value="${esc(searchQuery)}"><kbd>DEMO</kbd></div><div class="suggestion-label">${q?'SEARCH RESULTS':'POPULAR PLACES'}</div><div class="suggestion-list">${suggestions.map(p=>`<button class="suggestion-row ${selectedPlaceName===p.name?'selected':''}" data-action="choose-place" data-name="${esc(p.name)}"><span class="suggestion-icon">${catGlyph(p.category)}</span><span class="suggestion-info"><strong>${esc(p.name)}</strong><small>${esc(p.category)} · ${esc(p.address)}</small></span><span>${selectedPlaceName===p.name?'✓':'＋'}</span></button>`).join('')}${!suggestions.length?`<div class="no-results"><span>No matching demo places.</span><small>Add “${esc(searchQuery)}” as a custom place instead.</small></div>`:''}</div><div class="modal-actions add-place-actions"><span class="custom-hint">${selectedPlaceName?`Ready to add ${esc(selectedPlaceName)}`:'Live Google Places search can be connected with an API key.'}</span><button class="btn btn-primary" data-action="confirm-place" ${!selectedPlaceName&&!searchQuery.trim()?'disabled':''}>＋ Add to itinerary</button></div></div></div>`;const input=document.getElementById('place-query');input?.focus();input?.setSelectionRange(input.value.length,input.value.length);return;}
    if(modal==='map-settings'){const key=localStorage.getItem('wayfarer-google-key')||'';modalRoot.innerHTML=`<div class="modal-backdrop" data-backdrop><div class="modal-card"><div class="modal-top"><div class="modal-icon">⚙</div><button class="icon-btn" data-action="close-modal">✕</button></div><h2>Map settings</h2><p class="modal-subtitle">Optionally enable a Google Maps directions embed for the current day. Keep the key restricted to your site and enable billing in Google Cloud.</p><label class="field-label">Google Maps Embed API key<input id="google-key-input" value="${esc(key)}" placeholder="Paste a browser-restricted API key"></label><div class="settings-box"><strong style="font-size:11px">Without a key</strong><p>The demo uses OpenStreetMap. Place links still open Google Maps, but route lines and ETAs are approximate.</p><a style="font-size:10px;color:#547a5d" href="https://developers.google.com/maps/documentation/embed/get-started" target="_blank" rel="noreferrer">Google Maps Embed API setup ↗</a></div><div class="modal-actions"><button class="btn btn-quiet" data-action="clear-google-key">Clear key</button><button class="btn btn-primary" data-action="save-google-key">Save settings</button></div></div></div>`;return;}
  }
  function addPlace(p){const list=day().stops;list.push({...p,id:id()});selectedId=list[list.length-1].id;save();closeModal();render();showToast(`${p.name} added to Day ${dayIndex+1}`);}
  function doCreateTrip(form){const fd=new FormData(form),title=String(fd.get('title')||'').trim(),destination=String(fd.get('destination')||'').trim(),start=String(fd.get('start')),end=String(fd.get('end'));const error=form.querySelector('.form-error');if(!destination){error.hidden=false;error.textContent='Add a destination to create your trip.';return;}if(end<start){error.hidden=false;error.textContent='The end date must be on or after the start date.';return;}const days=[];let cur=new Date(start+'T12:00:00'),last=new Date(end+'T12:00:00');for(let i=0;cur<=last&&i<21;i++,cur.setDate(cur.getDate()+1)){const dt=cur.toISOString().slice(0,10);days.push({id:id(),date:dt,title:i===0?'Arrival & first look':i===1?'Explore the city':'Make it your own',stops:[]});}const trip={id:id(),title:title||`${destination} trip`,destination,start,end,cover:'new',days};trips.unshift(trip);currentId=trip.id;dayIndex=0;selectedId=null;save();closeModal();render();showToast('Your new trip is ready');}
  function dispatch(action,el){const t=current(),dy=day(),list=dy.stops;
    switch(action){case'new-trip':openModal('new-trip');break;case'add-place':openModal('add-place');break;case'close-modal':closeModal();break;case'open-menu':mobileSidebarOpen=true;render();break;case'close-menu':mobileSidebarOpen=false;render();break;case'switch-trip':currentId=el.dataset.id;dayIndex=0;selectedId=null;editingId=null;tripMenu=false;render();break;case'switch-day':dayIndex=Number(el.dataset.index);selectedId=null;editingId=null;render();break;case'prev-day':dayIndex=Math.max(0,dayIndex-1);selectedId=null;render();break;case'next-day':dayIndex=Math.min(t.days.length-1,dayIndex+1);selectedId=null;render();break;case'select-stop':selectedId=el.dataset.id;render();break;case'toggle-edit':editingId=editingId===el.dataset.id?null:el.dataset.id;selectedId=el.dataset.id;render();break;case'delete-stop':{const s=list.find(x=>x.id===el.dataset.id);dy.stops=list.filter(x=>x.id!==el.dataset.id);selectedId=null;editingId=null;save();render();showToast(`${s?.name||'Place'} removed`);break;}case'move-stop':{const from=Number(el.dataset.index),to=from+Number(el.dataset.delta);if(to>=0&&to<list.length){const [v]=list.splice(from,1);list.splice(to,0,v);selectedId=v.id;save();render();showToast('Itinerary order updated');}break;}case'map-mode':mapMode=el.dataset.mode;render();break;case'choose-place':selectedPlaceName=el.dataset.name;renderModal();break;case'confirm-place':{const p=library.find(x=>x.name===selectedPlaceName);if(p){addPlace({...p,id:id(),time:p.time,duration:p.duration,notes:'',transport:'transit',approximate:false});}else if(searchQuery.trim()){const name=searchQuery.trim(),center=t.destination.toLowerCase().includes('kyoto')?[35.005,135.765]:DEFAULT_CENTER;addPlace({id:id(),name,category:'Saved place',address:`${name}, ${t.destination}`,lat:center[0],lng:center[1],duration:60,time:'10:00',notes:'',transport:'transit',approximate:true});}break;}case'duplicate-trip':{const cloned=JSON.parse(JSON.stringify(t));cloned.id=id();cloned.title+=' (copy)';cloned.days=cloned.days.map(dy=>({...dy,id:id(),stops:dy.stops.map(s=>({...s,id:id()}))}));trips.unshift(cloned);currentId=cloned.id;dayIndex=0;tripMenu=false;save();render();showToast('Trip duplicated');break;}case'delete-trip':{if(trips.length===1){showToast('Keep at least one trip in your workspace');break;}trips=trips.filter(x=>x.id!==t.id);currentId=trips[0].id;dayIndex=0;tripMenu=false;save();render();showToast('Trip deleted');break;}case'trip-menu':tripMenu=!tripMenu;render();break;case'day-tip':showToast('Tip: drag stops to change the order');break;case'share-trip':{const text=`${t.title} · ${t.destination} · ${t.start}–${t.end}`;if(navigator.share)navigator.share({title:t.title,text}).catch(()=>{});else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>showToast('Trip summary copied')).catch(()=>showToast(text));}else showToast(text);break;}case'map-settings':openModal('map-settings');break;case'save-google-key':{const val=document.getElementById('google-key-input')?.value.trim();if(val)localStorage.setItem('wayfarer-google-key',val);else localStorage.removeItem('wayfarer-google-key');closeModal();render();showToast(val?'Google Maps embed enabled':'Map settings saved');break;}case'clear-google-key':localStorage.removeItem('wayfarer-google-key');closeModal();render();showToast('Using OpenStreetMap preview');break;case'noop':break;}
  }
  app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.tagName==='A')return;dispatch(el.dataset.action,el);});
  app.addEventListener('input',e=>{if(e.target.id==='place-query'){searchQuery=e.target.value;selectedPlaceName=null;const pos=e.target.selectionStart;renderModal();const next=document.getElementById('place-query');if(next){next.focus();next.setSelectionRange(pos,pos);}}});
  app.addEventListener('change',e=>{const el=e.target;if(!el.dataset.edit)return;const s=day().stops.find(x=>x.id===el.dataset.id);if(!s)return;if(el.dataset.edit==='duration')s.duration=Number(el.value);else s[el.dataset.edit]=el.value;save();render();});
  modalRoot.addEventListener('input',e=>{if(e.target.id==='place-query'){searchQuery=e.target.value;selectedPlaceName=null;const p=e.target.selectionStart;renderModal();const next=document.getElementById('place-query');if(next){next.focus();next.setSelectionRange(p,p);}}});
  modalRoot.addEventListener('click',e=>{if(e.target.matches('[data-backdrop]')){closeModal();return;}const el=e.target.closest('[data-action]');if(el)dispatch(el.dataset.action,el);});
  modalRoot.addEventListener('submit',e=>{if(e.target.id==='new-trip-form'){e.preventDefault();doCreateTrip(e.target);}});
  app.addEventListener('dragstart',e=>{const card=e.target.closest('.stop-card');if(!card)return;draggingIndex=Number(card.dataset.index);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(draggingIndex));setTimeout(()=>card.classList.add('dragging'),0);});
  app.addEventListener('dragover',e=>{if(e.target.closest('.stop-card')){e.preventDefault();e.dataTransfer.dropEffect='move';}});
  app.addEventListener('drop',e=>{const card=e.target.closest('.stop-card');if(!card||draggingIndex===null)return;e.preventDefault();const from=Number(e.dataTransfer.getData('text/plain')),to=Number(card.dataset.index);if(!Number.isNaN(from)&&from!==to){const list=day().stops;const [moved]=list.splice(from,1);list.splice(to,0,moved);selectedId=moved.id;save();render();showToast('Itinerary order updated');}draggingIndex=null;});
  app.addEventListener('dragend',()=>{draggingIndex=null;});
  render();
})();
</script>
</body></html>
